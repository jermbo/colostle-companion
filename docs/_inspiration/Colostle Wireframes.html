<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Colostle Companion · Wireframes</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
  /* Phone frame for our wireframes */
  .phone-frame {
    width: 100%; height: 100%;
    background: var(--paper);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-session.jsx"></script>
<script type="text/babel" src="screens-party.jsx"></script>
<script type="text/babel" src="screens-story.jsx"></script>
<script type="text/babel" src="screens-other.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// Phone artboard dimensions - close to iPhone proportions
const PW = 320;
const PH = 580;

const Frame = ({ children }) => (
  <div className="phone-frame">{children}</div>
);

// Tweak defaults
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAnnotations": true,
  "accent": "#2b4a7a",
  "paperTint": "warm",
  "density": "comfy"
}/*EDITMODE-END*/;

const PALETTES = {
  warm: { '--paper': '#f4efe6', '--paper-warm': '#ebe3d3' },
  cool: { '--paper': '#eef0ee', '--paper-warm': '#dde2dd' },
  bone: { '--paper': '#f6f3ec', '--paper-warm': '#e8e2d3' },
  dusk: { '--paper': '#e6e1d8', '--paper-warm': '#d2cbbc' },
};

const ACCENT_OPTIONS = ['#2b4a7a', '#7a3a4a', '#3a6a4a', '#7a5a2a'];

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tweak vars to root
  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--accent', tweaks.accent);
    const p = PALETTES[tweaks.paperTint] || PALETTES.warm;
    Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
  }, [tweaks.accent, tweaks.paperTint]);

  // Toggle annotations
  useEffect(() => {
    document.body.classList.toggle('wf-no-annos', !tweaks.showAnnotations);
  }, [tweaks.showAnnotations]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="intro" title="Colostle Companion · Wireframes"
                   subtitle="Low-fi explorations · 6 screens · 14 variants. Tap any artboard's ⤢ to view full-screen.">
          <DCArtboard id="readme" label="README" width={420} height={PH}>
            <div style={{padding: 24, fontFamily:'Kalam, cursive', color: '#1f1a17', height:'100%', overflowY:'auto', background:'#f4efe6'}}>
              <div style={{fontFamily:'Caveat, cursive', fontSize: 36, fontWeight: 700, lineHeight: 1}}>
                Hello.
              </div>
              <div style={{fontFamily:'Special Elite, monospace', fontSize: 11, marginTop: 6, color:'#4a423d', textTransform:'uppercase', letterSpacing:'0.05em'}}>
                // colostle companion · wireframes v1
              </div>
              <div style={{height: 14}}/>
              <div style={{fontSize: 14, lineHeight: 1.5}}>
                Six screens, 2–3 variants each. Aesthetic is intentionally rough so we
                explore <i>structure</i> and <i>flow</i>, not pixels.
              </div>
              <div style={{height: 16}}/>
              <div className="wf-divider"/>
              <div style={{height: 12}}/>
              <div style={{fontFamily:'Caveat, cursive', fontWeight: 700, fontSize: 20}}>What's here</div>
              <ul style={{paddingLeft: 18, fontSize: 13, lineHeight: 1.55}}>
                <li><b>Home</b> — campaign list (3 metaphors)</li>
                <li><b>Session</b> — the flip experience (3 layouts)</li>
                <li><b>Party</b> — characters &amp; companions (2 layouts)</li>
                <li><b>Story</b> — beat history / map / journal (3)</li>
                <li><b>Inventory</b> — items by source-card (2)</li>
                <li><b>Cards</b> — prompt reference (2)</li>
              </ul>
              <div style={{height: 6}}/>
              <div className="wf-divider"/>
              <div style={{height: 12}}/>
              <div style={{fontFamily:'Caveat, cursive', fontWeight: 700, fontSize: 20}}>Patterns to discuss</div>
              <ul style={{paddingLeft: 18, fontSize: 13, lineHeight: 1.55}}>
                <li>How prominent should the deck be? (hero · sticky · tab)</li>
                <li>Beats as timeline rows vs. prose-with-margins?</li>
                <li>Cards-as-source: every item / NPC / beat traces back to the card that made it</li>
                <li>Combat is opt-in — separate counter, manual flip</li>
                <li>One PC at a time vs. table of all PCs?</li>
              </ul>
              <div style={{height: 14}}/>
              <div className="wf-box-dashed" style={{padding: 12, fontSize: 12, lineHeight: 1.5}}>
                <b>tweaks</b> — toggle annotations, swap accent color, change paper tint,
                tighten density. Open the Tweaks panel from the toolbar.
              </div>
              <div style={{height: 12}}/>
              <div style={{fontFamily:'Special Elite, monospace', fontSize: 10, color:'#8a8079'}}>
                ─── original design · not based on any existing app ───
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="home" title="1 · Home / Campaigns"
                   subtitle="Where you land. How do you pick what to play?">
          <DCArtboard id="home-a" label="A · Bookshelf" width={PW} height={PH}><Frame><HomeA/></Frame></DCArtboard>
          <DCArtboard id="home-b" label="B · Card stacks" width={PW} height={PH}><Frame><HomeB/></Frame></DCArtboard>
          <DCArtboard id="home-c" label="C · Last-quote hook" width={PW} height={PH}><Frame><HomeC/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="session" title="2 · Active session · The Flip"
                   subtitle="The most important screen. How tactile is the flip? Where does the journal live?">
          <DCArtboard id="sess-a" label="A · Card-stage hero" width={PW} height={PH}><Frame><SessionA/></Frame></DCArtboard>
          <DCArtboard id="sess-b" label="B · Timeline-as-you-play" width={PW} height={PH}><Frame><SessionB/></Frame></DCArtboard>
          <DCArtboard id="sess-c" label="C · Tabbed deck/journal/map" width={PW} height={PH}><Frame><SessionC/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="party" title="3 · Party & characters"
                   subtitle="Multi-character + companion (Rook). All at once or one at a time?">
          <DCArtboard id="party-a" label="A · Single sheet + switcher" width={PW} height={PH}><Frame><PartyA/></Frame></DCArtboard>
          <DCArtboard id="party-b" label="B · Card-table (all PCs)" width={PW} height={PH}><Frame><PartyB/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="story" title="4 · Story · timeline / map / journal"
                   subtitle="The accumulated beats. Three very different metaphors.">
          <DCArtboard id="story-a" label="A · Linear timeline" width={PW} height={PH}><Frame><StoryA/></Frame></DCArtboard>
          <DCArtboard id="story-b" label="B · Map of travels" width={PW} height={PH}><Frame><StoryB/></Frame></DCArtboard>
          <DCArtboard id="story-c" label="C · Open journal book" width={PW} height={PH}><Frame><StoryC/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="inv" title="5 · Inventory"
                   subtitle="Items keep their source-card so the story stays linked to the deck.">
          <DCArtboard id="inv-a" label="A · Categorized list" width={PW} height={PH}><Frame><InventoryA/></Frame></DCArtboard>
          <DCArtboard id="inv-b" label="B · Slot grid + equip" width={PW} height={PH}><Frame><InventoryB/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="cards" title="6 · Card prompt reference"
                   subtitle="Browsing the prompts deck for rules-lookup.">
          <DCArtboard id="cards-a" label="A · Suit grid · browse" width={PW} height={PH}><Frame><CardsA/></Frame></DCArtboard>
          <DCArtboard id="cards-b" label="B · Detail · 9 of clubs" width={PW} height={PH}><Frame><CardsB/></Frame></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Display">
          <TweakToggle
            label="Show annotations"
            value={tweaks.showAnnotations}
            onChange={v => setTweak('showAnnotations', v)}
          />
        </TweakSection>
        <TweakSection title="Aesthetic">
          <TweakColor
            label="Accent ink"
            value={tweaks.accent}
            options={ACCENT_OPTIONS}
            onChange={v => setTweak('accent', v)}
          />
          <TweakRadio
            label="Paper tint"
            value={tweaks.paperTint}
            options={[
              {value:'warm', label:'Warm'},
              {value:'cool', label:'Cool'},
              {value:'bone', label:'Bone'},
              {value:'dusk', label:'Dusk'},
            ]}
            onChange={v => setTweak('paperTint', v)}
          />
        </TweakSection>
        <TweakSection title="Density">
          <TweakRadio
            label="Spacing"
            value={tweaks.density}
            options={[{value:'tight', label:'Tight'},{value:'comfy', label:'Comfy'}]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
