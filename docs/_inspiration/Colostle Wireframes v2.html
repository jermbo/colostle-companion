<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Colostle Companion · Wireframes</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
  /* Phone frame for our wireframes */
  .phone-frame {
    width: 100%; height: 100%;
    background: var(--paper);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-session.jsx"></script>
<script type="text/babel" src="screens-party.jsx"></script>
<script type="text/babel" src="screens-story.jsx"></script>
<script type="text/babel" src="screens-other.jsx"></script>
<script type="text/babel" src="screens-v2-core.jsx"></script>
<script type="text/babel" src="screens-v2-story.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// Phone artboard dimensions - close to iPhone proportions
const PW = 320;
const PH = 580;

const Frame = ({ children }) => (
  <div className="phone-frame">{children}</div>
);

// Tweak defaults
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAnnotations": true,
  "accent": "#3a6a4a",
  "paperTint": "warm",
  "density": "comfy"
}/*EDITMODE-END*/;

const PALETTES = {
  warm: { '--paper': '#f4efe6', '--paper-warm': '#ebe3d3' },
  cool: { '--paper': '#eef0ee', '--paper-warm': '#dde2dd' },
  bone: { '--paper': '#f6f3ec', '--paper-warm': '#e8e2d3' },
  dusk: { '--paper': '#e6e1d8', '--paper-warm': '#d2cbbc' },
};

const ACCENT_OPTIONS = ['#2b4a7a', '#7a3a4a', '#3a6a4a', '#7a5a2a'];

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tweak vars to root
  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--accent', tweaks.accent);
    const p = PALETTES[tweaks.paperTint] || PALETTES.warm;
    Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
  }, [tweaks.accent, tweaks.paperTint]);

  // Toggle annotations
  useEffect(() => {
    document.body.classList.toggle('wf-no-annos', !tweaks.showAnnotations);
  }, [tweaks.showAnnotations]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="intro" title="Colostle Companion · Wireframes v2"
                   subtitle="Refined picks · Story now has all three views as tabs · added new-campaign, session-end, and companion screens.">
          <DCArtboard id="readme" label="README" width={420} height={PH}>
            <div style={{padding: 24, fontFamily:'Kalam, cursive', color: '#1f1a17', height:'100%', overflowY:'auto', background:'#f4efe6'}}>
              <div style={{fontFamily:'Caveat, cursive', fontSize: 36, fontWeight: 700, lineHeight: 1}}>
                v2 · tightened.
              </div>
              <div style={{fontFamily:'Special Elite, monospace', fontSize: 11, marginTop: 6, color:'#4a423d', textTransform:'uppercase', letterSpacing:'0.05em'}}>
                // colostle companion · wireframes v2
              </div>
              <div style={{height: 14}}/>
              <div style={{fontSize: 14, lineHeight: 1.5}}>
                Took your picks and refined them. Story is now a single destination
                with three tabs (Timeline · Map · Journal). Added three screens you'll
                likely need: new-campaign setup, end-of-session summary, and
                companion (Rook) detail.
              </div>
              <div style={{height: 16}}/>
              <div className="wf-divider"/>
              <div style={{height: 12}}/>
              <div style={{fontFamily:'Caveat, cursive', fontWeight: 700, fontSize: 20}}>What's new</div>
              <ul style={{paddingLeft: 18, fontSize: 13, lineHeight: 1.55}}>
                <li>Home — bookshelf w/ resume hero on top</li>
                <li>Session — tabs + bigger card stage + counters in the header</li>
                <li>Party — cleaner stat grid + relationships block</li>
                <li>Story — Timeline/Map/Journal as one destination</li>
                <li>+ New campaign wizard, Session-end summary, Companion sheet</li>
              </ul>
              <div style={{height: 14}}/>
              <div className="wf-box-dashed" style={{padding: 12, fontSize: 12, lineHeight: 1.5}}>
                v1 (all variants) is still in <i>Colostle Wireframes.html</i> for reference.
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="home" title="1 · Home" subtitle="Bookshelf w/ resume hero on top.">
          <DCArtboard id="home-v2" label="Home" width={PW} height={PH}><Frame><HomeV2/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="session" title="2 · Active session" subtitle="Tabbed deck/beats/notes. Counters live in the header.">
          <DCArtboard id="sess-v2" label="Session · Deck tab" width={PW} height={PH}><Frame><SessionV2/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="party" title="3 · Party & characters" subtitle="Single sheet + horizontal switcher.">
          <DCArtboard id="party-v2" label="Party · Vela" width={PW} height={PH}><Frame><PartyV2/></Frame></DCArtboard>
          <DCArtboard id="comp-v2" label="Companion (Rook)" width={PW} height={PH}><Frame><CompanionDetail/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="story" title="4 · Story · all three views as tabs"
                   subtitle="One destination, three lenses on the same data.">
          <DCArtboard id="story-tl" label="Timeline tab" width={PW} height={PH}><Frame><StoryTimelineV2/></Frame></DCArtboard>
          <DCArtboard id="story-mp" label="Map tab" width={PW} height={PH}><Frame><StoryMapV2/></Frame></DCArtboard>
          <DCArtboard id="story-jr" label="Journal tab" width={PW} height={PH}><Frame><StoryJournalV2/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="inv" title="5 · Inventory" subtitle="Categorized list w/ source-card preserved.">
          <DCArtboard id="inv-v2" label="Inventory" width={PW} height={PH}><Frame><InventoryA/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="cards" title="6 · Card prompt reference" subtitle="Browse + detail kept together.">
          <DCArtboard id="cards-a" label="Browse" width={PW} height={PH}><Frame><CardsA/></Frame></DCArtboard>
          <DCArtboard id="cards-b" label="Detail · 9 of clubs" width={PW} height={PH}><Frame><CardsB/></Frame></DCArtboard>
        </DCSection>

        <DCSection id="new" title="7 · New screens" subtitle="Setup, end-of-session summary.">
          <DCArtboard id="new-camp" label="New campaign · step 2" width={PW} height={PH}><Frame><NewCampaign/></Frame></DCArtboard>
          <DCArtboard id="sess-end" label="End of session" width={PW} height={PH}><Frame><SessionEnd/></Frame></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Display">
          <TweakToggle
            label="Show annotations"
            value={tweaks.showAnnotations}
            onChange={v => setTweak('showAnnotations', v)}
          />
        </TweakSection>
        <TweakSection title="Aesthetic">
          <TweakColor
            label="Accent ink"
            value={tweaks.accent}
            options={ACCENT_OPTIONS}
            onChange={v => setTweak('accent', v)}
          />
          <TweakRadio
            label="Paper tint"
            value={tweaks.paperTint}
            options={[
              {value:'warm', label:'Warm'},
              {value:'cool', label:'Cool'},
              {value:'bone', label:'Bone'},
              {value:'dusk', label:'Dusk'},
            ]}
            onChange={v => setTweak('paperTint', v)}
          />
        </TweakSection>
        <TweakSection title="Density">
          <TweakRadio
            label="Spacing"
            value={tweaks.density}
            options={[{value:'tight', label:'Tight'},{value:'comfy', label:'Comfy'}]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
